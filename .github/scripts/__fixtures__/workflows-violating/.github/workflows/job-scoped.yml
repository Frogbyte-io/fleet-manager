# Fixture: a workflow whose top-level permissions look correct, but which
# widens them on one job. The OIDC token this asks for is how a cloud deploy
# gets its credentials without a stored secret.
name: Job scoped
on:
  push:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - run: echo ok
