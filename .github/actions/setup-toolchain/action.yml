name: Set up pinned toolchains
description: >-
  Installs the toolchain versions pinned by .github/toolchain.env and
  rust-toolchain.toml, and exports every pinned version as an environment
  variable. Every CI job goes through this action, so bumping a version is a
  one-line edit in one file rather than a search across workflows.

inputs:
  node:
    description: Install the pinned Node.js version.
    required: false
    default: 'true'
  pnpm:
    description: Activate the pinned pnpm through the pinned Corepack. Implies node.
    required: false
    default: 'false'
  rust:
    description: Install the toolchain pinned by rust-toolchain.toml.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Load pinned versions
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        # The loader validates every line and normalises CRLF before anything
        # reaches the job environment, so a Windows checkout with
        # core.autocrlf=true cannot inject a trailing \r into a pinned value.
        # load-toolchain-env.test.mjs proves both halves.
        bash "${GITHUB_ACTION_PATH}/../../scripts/load-toolchain-env.sh" \
          "${GITHUB_ACTION_PATH}/../../toolchain.env"

    - name: Install Node.js
      if: inputs.node == 'true' || inputs.pnpm == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.versions.outputs.node }}

    - name: Activate pnpm through Corepack
      if: inputs.pnpm == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Corepack is installed explicitly rather than relying on the copy
        # bundled with Node, which is being unbundled upstream.
        npm install --global "corepack@${COREPACK_VERSION}"
        corepack enable pnpm
        corepack prepare "pnpm@${PNPM_VERSION}" --activate
        echo "pnpm $(pnpm --version)"

    - name: Install the pinned Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # With no toolchain argument rustup installs the active toolchain, which
        # rust-toolchain.toml defines. The version is never repeated here.
        rustup toolchain install --no-self-update
        rustup show active-toolchain
        rustc --version
        cargo --version
        cargo fmt --version
        cargo clippy --version
