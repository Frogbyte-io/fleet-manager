# Secret-scanning configuration. Extends the upstream ruleset rather than
# replacing it, so new provider rules arrive with a gitleaks version bump
# (GITLEAKS_VERSION in .github/toolchain.env).
#
# Policy, including what to do when this finds something real:
# .github/SECURITY.md

title = "Fleet Manager secret scan"

[extend]
useDefault = true

[[allowlists]]
description = """
The generic high-entropy rule matches English prose in the planning documents —
phrases such as "secret redaction, duplicate/correlation cases" score as a
random-looking API key. This narrows only that one rule, only in Markdown under
docs/. Every provider-specific rule (private keys, cloud credentials, tokens)
still applies there, and no rule is relaxed anywhere else in the tree.
"""
targetRules = ["generic-api-key"]
paths = ['''(^|/)docs/.*\.md$''']

[[allowlists]]
description = """
Protocol fixture sources declare opaque UUIDv7 identities beside field names
such as idempotency_key, which is exactly the shape the generic high-entropy
rule looks for. The values are frozen test vectors with no privilege anywhere,
and the field names come from proto/fleet/node/v1/node.proto rather than from a
choice this file can influence. This narrows only that one rule, only in the
protocol fixture module and the encoded fixtures it describes. Every
provider-specific rule still applies there, and no rule is relaxed elsewhere.

Real secrets never appear in fixtures; see AGENTS.md and proto/README.md.
"""
targetRules = ["generic-api-key"]
paths = [
    '''^crates/fleet-protocol/src/fixtures\.rs$''',
    '''^proto/fixtures/''',
]

[[allowlists]]
description = """
The redaction and key-handling modules test that PEM private-key armor is
recognised and scrubbed, so their unit tests must contain BEGIN/END PRIVATE KEY
lines. The bodies are placeholders ("fake", "AAAA", base64 of short words) that
are not keys. This narrows only the private-key rule, only in these three
files. Every other rule still applies there, and the private-key rule still
applies everywhere else.
"""
targetRules = ["private-key"]
paths = [
    '''^crates/fleet-core/src/redact\.rs$''',
    '''^crates/fleet-controller/src/lab_ssh_keys\.rs$''',
    '''^crates/providers/fleet-provider-ssh/src/key\.rs$''',
]

[[allowlists]]
description = """
Exact placeholder values that the redaction, Registry and broker tests use as
"this looks like a credential" input, so the tests can check it never reaches
output. They are made up (counting sequences, "fake" passwords, a fixed
UUIDv7 test identity, a made-up 24-character key) and grant nothing anywhere.

W269N-WFGWX-YVC9B-4J6C9-T83GX is Microsoft's published KMS client setup key
(GVLK) for Windows Pro, documented publicly for volume activation; it is not a
licence.

Matching is on the exact secret value, so a real credential in the same
files is still caught.
"""
targetRules = ["generic-api-key", "curl-auth-user", "curl-auth-header"]
regexTarget = "secret"
regexes = [
    '''^(api_key=)?0123456789abcdef0123456789abcdef$''',
    '''^abcdef0123456789abcdef0123456789$''',
    '''^(api_key=)?Zx81QwErTy93LkJhGf62Mn40$''',
    '''^abcdefgh12345678$''',
    '''^abcdefghijklmnop1234$''',
    '''^01890f3e-9b4a-7cc2-98c3-d24e8f58f2a1$''',
    '''^bob:fake(1|pw1)$''',
    '''^W269N-WFGWX-YVC9B-4J6C9-T83GX$''',
]
