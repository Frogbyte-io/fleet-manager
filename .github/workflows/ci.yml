name: CI

# The single CI entry point for the repository. It is written to grow: each
# workspace-specific job is gated on that workspace existing, so the jobs light
# up as the scaffolds land instead of needing this file rewritten.
#
#   #22  root Cargo.toml       -> enables rust-linux, rust-windows, cargo-deny
#   #30  pnpm-workspace.yaml   -> enables web
#   #31  root verification cmd -> add a step to the jobs below, not a new pipeline
#   #23  moves the legacy package to legacy/ -> detect follows it automatically
#
# Nothing here holds a deployment credential; see .github/SECURITY.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. A job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: Detect workspaces
    runs-on: ubuntu-latest
    outputs:
      cargo: ${{ steps.probe.outputs.cargo }}
      pnpm: ${{ steps.probe.outputs.pnpm }}
      legacy_dir: ${{ steps.probe.outputs.legacy_dir }}
    steps:
      - uses: actions/checkout@v7

      # Existence probes, not globs. A glob over crates/** in a repository that
      # has no crates yet either matches nothing and fails, or matches nothing
      # and silently passes; neither is a useful signal.
      - id: probe
        shell: bash
        run: |
          set -euo pipefail
          exists() { if [ -e "$1" ]; then echo true; else echo false; fi; }
          legacy_dir=""
          if [ -f package-lock.json ]; then legacy_dir="."
          elif [ -f legacy/package-lock.json ]; then legacy_dir="legacy"
          fi
          {
            echo "cargo=$(exists Cargo.toml)"
            echo "pnpm=$(exists pnpm-workspace.yaml)"
            echo "legacy_dir=${legacy_dir}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Summarise
        shell: bash
        run: |
          {
            echo "### Detected workspaces"
            echo ""
            echo "| Workspace | Present | Enabled by |"
            echo "|---|---|---|"
            echo "| Cargo | ${{ steps.probe.outputs.cargo }} | #22 |"
            echo "| pnpm | ${{ steps.probe.outputs.pnpm }} | #30 |"
            echo "| Legacy Node | ${{ steps.probe.outputs.legacy_dir != '' }} | present today |"
          } >> "$GITHUB_STEP_SUMMARY"

  policy:
    name: Repository policy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      # The policy scripts import `yaml`, the one runtime dependency this
      # repository already has. `npm ci` refuses to run against a lockfile that
      # does not match package.json, which is half of the lockfile enforcement.
      #
      # #23: this install has to stay at the repository root. Moving the Node
      # package under legacy/ puts node_modules where .github/scripts cannot
      # resolve it, and these scripts are not part of the legacy package. It
      # fails loudly if that happens; it does not pass quietly.
      - name: Install from the lockfile
        run: npm ci

      - name: Installing must not rewrite the lockfile
        run: git diff --exit-code -- package-lock.json

      - name: Generated artifacts are up to date
        run: node .github/scripts/generate.mjs --check

      - name: Dependency licenses are in the allowed inbound set
        run: node .github/scripts/check-licenses.mjs

      - name: Workflows hold no deployment credentials
        run: node .github/scripts/check-workflows.mjs

      - name: Documentation links resolve
        run: npm run check:docs

      - name: Policy script tests
        run: node .github/scripts/test.mjs

  secrets:
    name: Secret scan (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A history scan needs history. Shallow clones make `gitleaks git`
          # inspect one commit and report a clean tree it never looked at.
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          node: 'false'

      # Installed from the pinned release and checksum rather than through a
      # third-party action, so the scanner itself is not an unpinned dependency.
      # Unpacked into the runner temp directory, not the workspace: the
      # binary embeds the detection rules and their test strings, so a scanner
      # left in the tree is a scanner that scans itself.
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            -o "${RUNNER_TEMP}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      # Block scalars: a run: value that opens with a quote is a quoted YAML
      # scalar, not a command line.
      - name: Scan the working tree
        run: |
          "${RUNNER_TEMP}/gitleaks" dir . --no-banner --redact --config .github/gitleaks.toml

      - name: Scan the commit history
        run: |
          "${RUNNER_TEMP}/gitleaks" git . --no-banner --redact --config .github/gitleaks.toml

  legacy-node:
    name: Legacy Node suite (Linux)
    needs: detect
    if: needs.detect.outputs.legacy_dir != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain

      - name: Install from the lockfile
        working-directory: ${{ needs.detect.outputs.legacy_dir }}
        run: npm ci

      - name: Installing must not rewrite the lockfile
        working-directory: ${{ needs.detect.outputs.legacy_dir }}
        run: git diff --exit-code -- package-lock.json

      # QUARANTINE: `waitForTask rejects on timeout` asserts against a 2 ms
      # wall-clock deadline and fails roughly four runs in five even on an idle
      # machine, so on a shared runner it is noise, not a signal. #23 replaces
      # the deadline with a deterministic clock and owns that fix; this repeats
      # the whole suite otherwise, and skips exactly one named test rather than
      # disabling the file or the suite.
      - name: Tests, with one quarantined
        working-directory: ${{ needs.detect.outputs.legacy_dir }}
        run: |
          set -euo pipefail
          echo "::notice::Quarantined until #23: 'waitForTask rejects on timeout'"
          node --test --test-skip-pattern='^waitForTask rejects on timeout$'

      # When #23 lands, the quarantine above becomes dead configuration. This
      # says so out loud instead of leaving it to rot.
      - name: Quarantine is still needed
        if: always()
        working-directory: ${{ needs.detect.outputs.legacy_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -rqF "waitForTask rejects on timeout" test/ 2>/dev/null; then
            echo "::warning::The quarantined test no longer exists. Remove the quarantine from .github/workflows/ci.yml."
          fi

  rust-linux:
    name: Rust full checks (Linux x86_64)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          node: 'false'
          rust: 'true'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  rust-windows:
    name: Rust compatibility checks (Windows)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          node: 'false'
          rust: 'true'

      # Windows is a supported target for the binaries and libraries, not the
      # platform the full suite is gated on. It has to compile, link, and
      # produce the binaries; Linux runs the exhaustive checks.
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo build --workspace --bins --locked

  cargo-deny:
    name: Cargo dependency policy (Linux)
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          node: 'false'
          rust: 'true'

      # Built from source at the pinned version. A prebuilt binary would be
      # faster but adds a second checksum to keep in step with the version.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version "${CARGO_DENY_VERSION}" --locked

      - name: Licenses, advisories, bans, and sources
        run: cargo deny check

  web:
    name: Web workspace (Linux)
    needs: detect
    if: needs.detect.outputs.pnpm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          pnpm: 'true'

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Installing must not rewrite the lockfile
        run: git diff --exit-code -- pnpm-lock.yaml

      # --if-present so that #30 can land the workspace and add the scripts in
      # whichever order suits it.
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run build

  ci:
    name: CI
    if: always()
    needs: [detect, policy, secrets, legacy-node, rust-linux, rust-windows, cargo-deny, web]
    runs-on: ubuntu-latest
    steps:
      # One status to require on the branch. A gated-off job reports "skipped",
      # which is a pass; anything else is not.
      - name: Every job succeeded or was skipped
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "Job results: ${RESULTS}"
          failed=0
          IFS=','
          for result in ${RESULTS}; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required job reported ${result}"; failed=1 ;;
            esac
          done
          exit "$failed"
