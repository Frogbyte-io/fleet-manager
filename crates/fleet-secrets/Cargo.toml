[package]
name = "fleet-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chacha20poly1305 = { version = "0.10.1", features = ["alloc"] }
fleet-application = { path = "../fleet-application" }
fleet-core = { path = "../fleet-core" }
hex = "0.4.3"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
uuid = { version = "1.26.0", features = ["v7"] }
zeroize = { version = "1.8.1", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
fleet-storage-sqlite = { path = "../fleet-storage-sqlite" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

