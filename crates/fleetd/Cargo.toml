[package]
name = "fleetd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fleet-application = { path = "../fleet-application" }
fleet-config = { path = "../fleet-config" }
fleet-core = { path = "../fleet-core" }
fleet-protocol = { path = "../fleet-protocol" }
futures-util = "0.3.31"
ring = "0.17.14"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect"] }
uuid = { version = "1.26.0", features = ["v7"] }

[lints]
workspace = true
