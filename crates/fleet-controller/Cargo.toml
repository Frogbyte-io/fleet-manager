[package]
name = "fleet-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.22.1"
axum = { version = "0.8.9", features = ["ws"] }
fleet-api = { path = "../fleet-api" }
fleet-application = { path = "../fleet-application" }
fleet-auth = { version = "0.1.0", path = "../fleet-auth" }
fleet-config = { version = "0.1.0", path = "../fleet-config" }
fleet-core = { version = "0.1.0", path = "../fleet-core" }
fleet-protocol = { path = "../fleet-protocol" }
fleet-provider-ssh = { version = "0.1.0", path = "../providers/fleet-provider-ssh" }
fleet-provider-frogenv = { version = "0.1.0", path = "../providers/fleet-provider-frogenv" }
fleet-provider-git = { version = "0.1.0", path = "../providers/fleet-provider-git" }
fleet-schema = { path = "../../schemas" }
fleet-provider-mise = { version = "0.1.0", path = "../providers/fleet-provider-mise" }
fleet-provider-skills-manager = { version = "0.1.0", path = "../providers/fleet-provider-skills-manager" }
fleet-provider-tailscale = { path = "../providers/fleet-provider-tailscale" }
fleet-provider-proxmox = { path = "../providers/fleet-provider-proxmox" }
fleet-provider-packer = { path = "../providers/fleet-provider-packer" }
fleet-secrets = { version = "0.1.0", path = "../fleet-secrets" }
fleet-storage-sqlite = { version = "0.1.0", path = "../fleet-storage-sqlite" }
futures-util = "0.3.31"
getrandom = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1.26.0", features = ["v7"] }

[dev-dependencies]
fleetd = { path = "../fleetd" }
http-body-util = "0.1.3"
ring = "0.17.14"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "io-util", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect"] }
tower = { version = "0.5.3", features = ["util"] }

