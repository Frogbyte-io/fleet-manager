[package]
name = "fleet-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
fleet-api = { path = "../fleet-api" }
fleet-application = { path = "../fleet-application" }
fleet-auth = { version = "0.1.0", path = "../fleet-auth" }
fleet-config = { version = "0.1.0", path = "../fleet-config" }
fleet-core = { version = "0.1.0", path = "../fleet-core" }
fleet-protocol = { path = "../fleet-protocol" }
fleet-provider-ssh = { version = "0.1.0", path = "../providers/fleet-provider-ssh" }
fleet-secrets = { version = "0.1.0", path = "../fleet-secrets" }
fleet-storage-sqlite = { version = "0.1.0", path = "../fleet-storage-sqlite" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1.26.0", features = ["v7"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.3"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "io-util", "time"] }
tower = { version = "0.5.3", features = ["util"] }

