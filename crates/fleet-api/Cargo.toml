[package]
name = "fleet-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
fleet-application = { version = "0.1.0", path = "../fleet-application" }
fleet-auth = { version = "0.1.0", path = "../fleet-auth" }
fleet-core = { path = "../fleet-core" }
futures-util = "0.3.31"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["time", "macros", "rt", "net"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"

[dev-dependencies]
async-trait = "0.1.92"
fleet-storage-sqlite = { path = "../fleet-storage-sqlite" }
http = "1.3.1"
http-body-util = "0.1.3"
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["macros", "rt"] }
tower = { version = "0.5.2", features = ["util"] }

[[bin]]
name = "fleet-openapi"
path = "src/bin/openapi.rs"

[lints]
workspace = true
