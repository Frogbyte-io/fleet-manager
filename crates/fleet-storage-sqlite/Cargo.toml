[package]
name = "fleet-storage-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
fleet-application = { path = "../fleet-application" }
fleet-core = { path = "../fleet-core" }
fs4 = { version = "1.1.0", features = ["sync"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros", "migrate", "json"] }
uuid = { version = "1.26.0", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
fleet-auth = { path = "../fleet-auth" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

