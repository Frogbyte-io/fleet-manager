[package]
name = "fleet-application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The broker's `NoopAction`, for tests of the broker and its adapters.
test-support = []

[dependencies]
async-trait = "0.1.89"
fleet-core = { path = "../fleet-core" }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true


[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "test-util"] }
