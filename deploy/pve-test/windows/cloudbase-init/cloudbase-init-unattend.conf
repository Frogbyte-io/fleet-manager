# Cloudbase-Init configuration for the specialize pass of sysprep-unattend.xml: it loads the
# cloud-init drive and sets the computer name when the metadata carries a hostname. (Proxmox's
# configdrive2 metadata has none, so the random name from the answer file's ComputerName *
# stays.) Rendered by `windows-template prepare`; installed by setup-guest.ps1.
[DEFAULT]
username=@ADMIN_USER@
check_latest_version=false
bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
verbose=true
debug=true
logdir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
logfile=cloudbase-init-unattend.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService
plugins=cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin
allow_reboot=false
stop_service_on_exit=false
