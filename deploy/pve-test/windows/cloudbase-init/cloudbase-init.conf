# Cloudbase-Init service configuration (runs at every boot of a clone, after OOBE).
# Rendered by `windows-template prepare` (@ADMIN_USER@ = the fixture administrator) and
# installed by setup-guest.ps1. The metadata comes from the Proxmox cloud-init drive
# (citype configdrive2). Deliberately absent: CreateUserPlugin and SetUserPasswordPlugin
# (the specialize pass of sysprep-unattend.xml already gives every clone a random
# administrator password, and the fixture uses key login), and SetHostNamePlugin (the
# specialize pass sets the computer name; renaming here would wait for a reboot).
[DEFAULT]
username=@ADMIN_USER@
groups=Administrators
inject_user_password=false
first_logon_behaviour=no
check_latest_version=false
bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
verbose=true
debug=true
logdir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
logfile=cloudbase-init.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService
plugins=cloudbaseinit.plugins.common.sshpublickeys.SetUserSSHPublicKeysPlugin,
        cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin
allow_reboot=false
stop_service_on_exit=true
