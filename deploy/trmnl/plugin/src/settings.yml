---
strategy: webhook
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
polling_url: ''
polling_headers: ''
name: Fleet
description: Fleet Manager control plane status
refresh_interval: 15
custom_fields:
- keyname: webhook_url
  field_type: copyable_webhook_url
  name: Webhook URL
  description: Store this URL in the file TRMNL_WEBHOOK_URL_FILE names. Anyone who has it can write to this screen.
