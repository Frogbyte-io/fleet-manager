# Smoke deployment of the Fleet controller.
#
# Posture, decided once and asserted by deploy/smoke.sh:
# - no Docker socket, no host network, no privileged mode, no host mounts;
#   the controller needs none of these and must not grow them silently
# - read-only root filesystem with a tmpfs for /tmp
# - published to host loopback only: the controller is a trusted-LAN service,
#   and the smoke deployment must not imply that Internet exposure is fine
#
# The master key arrives as a mounted Docker secret backed by a file, which is
# the key source the typed configuration validates before readiness.

name: fleet-manager

services:
  controller:
    build:
      context: ..
      dockerfile: deploy/controller.Dockerfile
    image: fleet-manager/controller:local
    ports:
      # The host port is overridable so the smoke can dodge a port the
      # machine already uses; the default stays the documented 8080. An
      # explicit 0 lets Docker allocate a free port atomically, which the
      # smoke then reads back.
      - "127.0.0.1:${FLEET_SMOKE_PORT:-8080}:8080"
    environment:
      # Inside the container the listener must bind the container interface;
      # the host-facing reachability is limited by the loopback publish above.
      FLEET_LISTEN: 0.0.0.0:8080
      FLEET_WEB_DIST: /opt/fleet/web
      FLEET_DATA_DIR: /var/lib/fleet
      # The key source is a mounted Docker secret: a file, never an
      # environment variable or a build argument.
      FLEET_MASTER_KEY_FILE: /tmp/fleet-secrets/master_key
      # Lab placement policy (FM-715); the defaults are the controller's own.
      FLEET_LAB_MEMORY_OVERCOMMIT: ${FLEET_LAB_MEMORY_OVERCOMMIT:-1.0}
      FLEET_LAB_CPU_OVERCOMMIT: ${FLEET_LAB_CPU_OVERCOMMIT:-1.0}
      FLEET_LAB_CAPACITY_MAX_AGE_SECONDS: ${FLEET_LAB_CAPACITY_MAX_AGE_SECONDS:-300}
      # Lab artifact retention and size cap (FM-721); the bytes stay on the
      # data volume under /var/lib/fleet/lab-artifacts.
      FLEET_LAB_ARTIFACT_RETENTION_SECONDS: ${FLEET_LAB_ARTIFACT_RETENTION_SECONDS:-604800}
      FLEET_LAB_ARTIFACT_MAX_BYTES: ${FLEET_LAB_ARTIFACT_MAX_BYTES:-67108864}
      # Opt-in proxy for Packer image builds (#339); empty means off. Never put
      # credentials in it: the controller refuses a URL that carries them.
      FLEET_IMAGE_BUILD_PROXY: ${FLEET_IMAGE_BUILD_PROXY:-}
      FLEET_IMAGE_BUILD_NO_PROXY: ${FLEET_IMAGE_BUILD_NO_PROXY:-}
      # Opt-in pool of Fleet-assigned build addresses (#337); empty means off.
      # With it, `proxmox-clone` builds get a static address and the build
      # guest no longer chooses where the controller connects. All of CIDR,
      # range and gateway are required together; DNS is optional.
      FLEET_IMAGE_BUILD_ADDRESS_POOL: ${FLEET_IMAGE_BUILD_ADDRESS_POOL:-}
      FLEET_IMAGE_BUILD_ADDRESS_POOL_RANGE: ${FLEET_IMAGE_BUILD_ADDRESS_POOL_RANGE:-}
      FLEET_IMAGE_BUILD_ADDRESS_POOL_GATEWAY: ${FLEET_IMAGE_BUILD_ADDRESS_POOL_GATEWAY:-}
      FLEET_IMAGE_BUILD_ADDRESS_POOL_DNS: ${FLEET_IMAGE_BUILD_ADDRESS_POOL_DNS:-}
      FLEET_IMAGE_BUILD_ADDRESS_POOL_REFUSE_ISO: ${FLEET_IMAGE_BUILD_ADDRESS_POOL_REFUSE_ISO:-}
    volumes:
      # Runtime state (the SQLite database and friends). Named volume so a
      # `compose down -v` is the explicit destructive act.
      - fleet-data:/var/lib/fleet
    read_only: true
    tmpfs:
      - /tmp
    secrets:
      - master_key
    healthcheck:
      # The binary probes itself; no shell or HTTP client in the image.
      test: ["CMD", "fleet-controller", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 150s

volumes:
  fleet-data:

secrets:
  master_key:
    # Overridable so deploy/smoke.sh can hand the stack an ephemeral key and
    # production can point at a real, operator-managed one. The file must be
    # mode 0600 on the host. The root entrypoint copies the read-only secret
    # into owner-only tmpfs storage and drops to uid/gid 999 before serving.
    file: ${FLEET_MASTER_KEY_SOURCE:-./secrets/master_key}
