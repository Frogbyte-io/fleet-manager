# Example machine manifest - a persistent development VM/host. Replace with
# your real machines (see docs/schema.md); this one exists to illustrate the
# schema and to exercise the CLI (`agents-registry resolve dev-01`).
machine:
  id: dev-01
  host: proxmox-01
  os: linux
  roles:
    - javascript

capabilities:
  - editor

lifecycle:
  mode: persistent
